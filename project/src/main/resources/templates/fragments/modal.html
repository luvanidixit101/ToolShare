<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal(id, title, body, confirmText)" class="modal-overlay" th:id="${id}" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3 th:text="${title}">Modal Title</h3>
            <button class="modal-close" aria-label="Close" data-modal-close><i class="bi bi-x"></i></button>
        </div>
        <div class="modal-body">
            <p th:text="${body}">Modal body content goes here.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-modal-close>Cancel</button>
            <button class="btn btn-danger" th:text="${confirmText}" data-modal-confirm>Confirm</button>
        </div>
    </div>
</div>

<div th:fragment="deleteModal" class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h3>Delete Tool</h3>
            <button class="modal-close" aria-label="Close" data-modal-close><i class="bi bi-x"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-icon danger">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <p>Are you sure you want to delete this tool? This action cannot be undone, and all associated bookings will be cancelled.</p>
            <p class="text-muted small">Type the tool name to confirm:</p>
            <input type="text" class="form-control" id="deleteConfirmInput" placeholder="Tool name">
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-modal-close>Cancel</button>
            <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete Permanently</button>
        </div>
    </div>
</div>
</body>
</html>
