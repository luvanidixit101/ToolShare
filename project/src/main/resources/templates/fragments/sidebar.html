<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header">
        <a th:href="@{/tools/add}" class="btn btn-primary btn-block">
            <i class="bi bi-plus-lg"></i> List a Tool
        </a>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="sidebar-link">
            <i class="bi bi-house"></i> Home
        </a>
        <a th:href="@{/tools}" class="sidebar-link">
            <i class="bi bi-search"></i> Browse Tools
        </a>
        <a th:href="@{/tools/my-tools}" class="sidebar-link">
            <i class="bi bi-grid"></i> My Tools
        </a>
        <a th:href="@{/bookings}" class="sidebar-link">
            <i class="bi bi-calendar-check"></i> Bookings
        </a>
        <a th:href="@{/chat}" class="sidebar-link">
            <i class="bi bi-chat-dots"></i> Messages
        </a>
        <a th:href="@{/profile}" class="sidebar-link">
            <i class="bi bi-person"></i> Profile
        </a>
    </nav>
    <div class="sidebar-section" th:if="${currentUser != null}">
        <h5 class="sidebar-title">Account</h5>
        <a th:href="@{/auth/login}" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</aside>
</body>
</html>
