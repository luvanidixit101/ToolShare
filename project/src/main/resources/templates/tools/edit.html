<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Edit Tool')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="page-content">
    <div class="container">
        <nav class="breadcrumb">
            <a th:href="@{/}">Home</a>
            <i class="bi bi-chevron-right"></i>
            <a th:href="@{/tools/my-tools}">My Tools</a>
            <i class="bi bi-chevron-right"></i>
            <span class="breadcrumb-active" th:text="${tool.name}">Tool</span>
        </nav>

        <div class="form-page">
            <div class="form-page-header">
                <h1 class="page-title">Edit Tool</h1>
                <p class="page-subtitle">Update your tool listing details</p>
            </div>

            <div th:replace="fragments/alerts :: alerts"></div>

            <form th:action="@{/tools/edit/{id}(id=${tool.id})}" th:object="${tool}" method="post" class="tool-form" id="editToolForm" novalidate>
                <input type="hidden" th:field="*{id}">

                <!-- Image Section -->
                <div class="form-card">
                    <h2 class="form-card-title">
                        <i class="bi bi-camera"></i> Tool Photos
                    </h2>
                    <p class="form-card-desc">Current photos and any new uploads.</p>
                    <div class="image-upload-area" id="imageUploadArea">
                        <input type="file" id="toolImages" name="images" accept="image/*" multiple hidden>
                        <label for="toolImages" class="image-upload-label">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <span>Add more photos</span>
                            <span class="text-muted small">PNG, JPG up to 5MB each</span>
                        </label>
                        <div class="image-preview-grid">
                            <div th:each="img, iter : ${tool.galleryImages}" class="image-preview-item existing-image">
                                <img th:src="${img}" th:alt="${tool.name}">
                                <button type="button" class="image-remove-btn" aria-label="Remove photo">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Basic Info -->
                <div class="form-card">
                    <h2 class="form-card-title">
                        <i class="bi bi-info-circle"></i> Basic Information
                    </h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="toolName" class="form-label">Tool Name <span class="required">*</span></label>
                            <input type="text" id="toolName" th:field="*{name}" class="form-control" required>
                            <span class="form-error" data-error-for="toolName"></span>
                        </div>
                        <div class="form-group">
                            <label for="toolCategory" class="form-label">Category <span class="required">*</span></label>
                            <select id="toolCategory" th:field="*{category}" class="form-control" required>
                                <option value="">Select a category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}">Category</option>
                            </select>
                            <span class="form-error" data-error-for="toolCategory"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="toolDescription" class="form-label">Description <span class="required">*</span></label>
                        <textarea id="toolDescription" th:field="*{description}" class="form-control" rows="4" required></textarea>
                        <span class="form-error" data-error-for="toolDescription"></span>
                    </div>
                </div>

                <!-- Condition & Specs -->
                <div class="form-card">
                    <h2 class="form-card-title">
                        <i class="bi bi-gear"></i> Condition & Specifications
                    </h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="toolCondition" class="form-label">Condition <span class="required">*</span></label>
                            <select id="toolCondition" th:field="*{condition}" class="form-control" required>
                                <option value="">Select condition</option>
                                <option value="Excellent">Excellent - Like new</option>
                                <option value="Good">Good - Lightly used</option>
                                <option value="Fair">Fair - Functional with wear</option>
                            </select>
                            <span class="form-error" data-error-for="toolCondition"></span>
                        </div>
                        <div class="form-group">
                            <label for="toolSpecifications" class="form-label">Specifications</label>
                            <input type="text" id="toolSpecifications" th:field="*{specifications}" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Pricing & Location -->
                <div class="form-card">
                    <h2 class="form-card-title">
                        <i class="bi bi-cash"></i> Pricing & Location
                    </h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pricePerDay" class="form-label">Price per Day ($) <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-currency-dollar input-icon"></i>
                                <input type="number" id="pricePerDay" th:field="*{pricePerDay}" class="form-control input-with-icon"
                                       min="1" step="0.01" required>
                            </div>
                            <span class="form-error" data-error-for="pricePerDay"></span>
                        </div>
                        <div class="form-group">
                            <label for="securityDeposit" class="form-label">Security Deposit ($) <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-currency-dollar input-icon"></i>
                                <input type="number" id="securityDeposit" th:field="*{securityDeposit}" class="form-control input-with-icon"
                                       min="0" step="0.01" required>
                            </div>
                            <span class="form-error" data-error-for="securityDeposit"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="toolLocation" class="form-label">Location <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="bi bi-geo-alt input-icon"></i>
                            <input type="text" id="toolLocation" th:field="*{location}" class="form-control input-with-icon" required>
                        </div>
                        <span class="form-error" data-error-for="toolLocation"></span>
                    </div>
                </div>

                <!-- Availability -->
                <div class="form-card">
                    <h2 class="form-card-title">
                        <i class="bi bi-calendar-check"></i> Availability
                    </h2>
                    <div class="form-group">
                        <label class="form-label">Availability Status</label>
                        <div class="radio-group">
                            <label class="radio-card">
                                <input type="radio" name="availability" value="available" th:checked="${tool.available}">
                                <span class="radio-card-content">
                                    <i class="bi bi-check-circle"></i>
                                    <span>Available for booking</span>
                                </span>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="availability" value="unavailable" th:checked="${!tool.available}">
                                <span class="radio-card-content">
                                    <i class="bi bi-pause-circle"></i>
                                    <span>Temporarily unavailable</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions form-actions-with-delete">
                    <div class="form-actions-left">
                        <button type="button" class="btn btn-danger btn-outline" id="deleteToolBtn">
                            <i class="bi bi-trash"></i> Delete Tool
                        </button>
                    </div>
                    <div class="form-actions-right">
                        <a th:href="@{/tools/my-tools}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-loading" id="updateBtn">
                            <span class="btn-text"><i class="bi bi-check-lg"></i> Update Tool</span>
                            <span class="btn-spinner"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Delete Confirmation Modal -->
<div th:replace="fragments/modal :: deleteModal"></div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
