<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Forgot Password')"></head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-left-content">
                <a th:href="@{/}" class="auth-logo">
                    <i class="bi bi-tools"></i>
                    <span>ToolShare</span>
                </a>
                <h1>Forgot<br>Your Password?</h1>
                <p>No worries. We'll send you a reset link so you can get back to building.</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="auth-form-header">
                    <div class="auth-icon-wrapper">
                        <i class="bi bi-key"></i>
                    </div>
                    <h2>Reset Password</h2>
                    <p>Enter your email and we'll send you a link to reset your password.</p>
                </div>

                <div th:replace="fragments/alerts :: alerts"></div>

                <form th:action="@{/auth/forgot-password}" method="post" class="auth-form" id="forgotForm" novalidate>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control input-with-icon"
                                   placeholder="you@example.com" required>
                        </div>
                        <span class="form-error" data-error-for="email"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-loading" id="forgotBtn">
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-spinner"></span>
                    </button>
                </form>

                <p class="auth-footer-text">
                    Remember your password? <a th:href="@{/auth/login}" class="link-primary">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
