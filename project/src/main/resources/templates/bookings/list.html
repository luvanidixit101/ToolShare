<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('My Bookings')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="page-content">
    <div class="container">
        <div class="dashboard-header">
            <div>
                <h1 class="page-title">My Bookings</h1>
                <p class="page-subtitle">Track your tool rentals and bookings</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="bookingTabs">
            <button class="tab active" data-tab="all">All <span class="tab-count" th:text="${bookings != null ? #lists.size(bookings) : 0}">0</span></button>
            <button class="tab" data-tab="pending">Pending <span class="tab-count">1</span></button>
            <button class="tab" data-tab="approved">Approved <span class="tab-count">1</span></button>
            <button class="tab" data-tab="active">Active <span class="tab-count">1</span></button>
            <button class="tab" data-tab="completed">Completed <span class="tab-count">2</span></button>
            <button class="tab" data-tab="cancelled">Cancelled <span class="tab-count">1</span></button>
        </div>

        <!-- Bookings List -->
        <div class="booking-list" th:if="${bookings != null and !bookings.isEmpty()}" th:with="books=${bookings}">
            <div th:each="booking : ${books}" class="booking-item-card" th:attr="data-status=${booking.status}">
                <div class="booking-item-image">
                    <img th:src="${booking.toolImage}" th:alt="${booking.toolName}">
                </div>
                <div class="booking-item-info">
                    <div class="booking-item-header">
                        <span class="booking-item-id" th:text="${booking.bookingId}">BK-2026-001</span>
                        <span class="status-badge" th:classappend="${booking.status == 'pending' ? 'status-badge-pending' :
                            (booking.status == 'approved' ? 'status-badge-info' :
                            (booking.status == 'active' ? 'status-badge-success' :
                            (booking.status == 'completed' ? 'status-badge-completed' : 'status-badge-danger')))}"
                            th:text="${#strings.capitalize(booking.status)}">Status</span>
                    </div>
                    <h3 th:text="${booking.toolName}">Tool Name</h3>
                    <div class="booking-item-meta">
                        <span><i class="bi bi-person"></i> <span th:text="${booking.ownerName}">Owner</span></span>
                        <span><i class="bi bi-geo-alt"></i> <span th:text="${booking.location}">Location</span></span>
                        <span><i class="bi bi-calendar3"></i>
                            <span th:text="${booking.startDate + ' - ' + booking.endDate}">Dates</span>
                        </span>
                        <span><i class="bi bi-cash"></i> <span th:text="'$' + ${booking.totalPrice}">$75</span></span>
                    </div>
                </div>
                <div class="booking-item-actions">
                    <a th:href="@{/tools/{id}(id=${booking.toolId})}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-eye"></i> View
                    </a>
                    <button class="btn btn-outline-warning btn-sm" th:if="${booking.status == 'pending' or booking.status == 'approved'}">
                        <i class="bi bi-x-circle"></i> Cancel
                    </button>
                    <a th:href="@{/chat}" class="btn btn-outline-primary btn-sm" th:if="${booking.status != 'cancelled'}">
                        <i class="bi bi-chat-dots"></i> Contact
                    </a>
                    <button class="btn btn-outline-info btn-sm" th:if="${booking.status == 'active'}">
                        <i class="bi bi-arrow-return-left"></i> Return Tool
                    </button>
                    <button class="btn btn-accent btn-sm" th:if="${booking.status == 'completed'}">
                        <i class="bi bi-star"></i> Leave Review
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" th:if="${bookings == null or bookings.isEmpty()}">
            <div class="empty-state-icon">
                <i class="bi bi-calendar-x"></i>
            </div>
            <h3>No bookings yet</h3>
            <p>Browse available tools and make your first booking to see it here.</p>
            <a th:href="@{/tools}" class="btn btn-primary">Browse Tools</a>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
